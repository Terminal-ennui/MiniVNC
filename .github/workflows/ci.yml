name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version

      # The Keychain tests need an unlocked default keychain; use a throwaway one.
      - name: Set up test keychain
        run: |
          keychain="$RUNNER_TEMP/ci.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p ci "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"

      - name: Build
        run: swift build --build-tests

      - name: Test
        run: swift test

      - name: Build app bundle
        run: SIGN_IDENTITY=- scripts/build-app.sh

      - name: Package
        run: ditto -c -k --keepParent build/MiniVNC.app MiniVNC.zip

      - uses: actions/upload-artifact@v7
        with:
          name: MiniVNC-${{ github.sha }}
          path: MiniVNC.zip
          retention-days: 14
